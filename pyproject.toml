[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amagi-codetour"
version = "0.1.0"
description = "Generate a VS Code CodeTour (.tours/*.tour) for any repo: entry point first, 8-15 key files, every line anchor checked against the code."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AmagiLabs (Amagisolutionsgroup, Inc.)", email = "dev@amagisolutionsgroup.com" }]
keywords = ["cli", "codetour", "vscode", "onboarding", "documentation", "claude-code", "code-tour"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/amagilabs/amagi-codetour"

[project.scripts]
amagi-codetour = "amagi_codetour.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
